 <!DOCTYPE html>
<html lang="en">
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
		body {background-color: #0A2457;}
    </style>	
	
	<title>WhatsApp in the Chat</title>
<body>

 


  <div class="container">
        <div class="row justify-content-left">
            <div class="col-md-8 col-lg-6">
                <div class="card mt-5 shadow">
                    <div class="card-body text-center p-5">
                        <div class="mb-4">
                            <i class="bi bi-arrow-right-circle text-primary" style="font-size: 4rem;"></i>
                        </div>
                        <h1 class="card-title text-primary mb-4">Test page</h1>
						<p class="card-text lead mb-4">
                            WhatsApp in the <strong>Chat</strong> Widget
                        </p>	
						<p style="align-self: left;">Usage: </p>
						<p style="font-size: 75%;">WhatsappInChat.html?phone=&lt;Philips WhatsApp number&gt;</p>
						<p style="font-size: 75%;">For +1234 use WhatsappInChat.html?phone=%2B1234</p>						
 						<p style="font-size: 75%;">For es_test use WhatsappInChat.html?phone=es_test</p>                      
						<div class="alert alert-info mb-4">
						
							<h5 class="alert-heading">WhatsApp number</span></</h5>
                           <h5 class="alert-heading"><span id="phone">Unknown</span></</h5>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>			

	<script>    
		// Get the query string from the current URL
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
		let myEnv = urlParams.get('environment')
		let myDeplID = urlParams.get('deployment')		
        let waPhone = urlParams.get('phone');

		if (myEnv == null) {
    		myEnv = 'prod-euc1'
		}
		if (myDeplID == null) {
    		myDeplID = '1287ce94-721e-4a37-8532-0a6ddb3af044'
		}		
        if (waPhone) {
            document.getElementById('phone').textContent = waPhone;
        }
    </script>

	<script type="text/javascript" charset="utf-8">
	  (function (g, e, n, es, ys) {
		g['_genesysJs'] = e;
		g[e] = g[e] || function () {
		  (g[e].q = g[e].q || []).push(arguments)
		};
		g[e].t = 1 * new Date();
		g[e].c = es;
		ys = document.createElement('script'); ys.async = 1; ys.src = n; ys.charset = 'utf-8'; document.head.appendChild(ys);
	  })(window, 'Genesys', 'https://apps.mypurecloud.de/genesys-bootstrap/genesys.min.js', {
		environment: myEnv,
		deploymentId: myDeplID
	  });
	  
		Genesys("command", "Database.set", {
		  messaging: { customAttributes: {
			waTargetAddress: waPhone ? waPhone : "Unknown"
		  }}});
	</script>


</body>
</html>
